<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}河道氨氮快照发布平台{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">河道氨氮快照发布平台</a>
    <nav>
      <a href="/">上传与当前版本</a>
      <a href="/versions">版本历史</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% block content %}{% endblock %}
</main>
<footer class="wrap site-footer">
  <p>所有结果统一换算为 mg/L。已发布版本不可修改，新数据以新版本整份发布。</p>
</footer>
</body>
</html>
